(function(){
 var D=null,tm=0,tr=null,sx=0,sy=0,ly=0,noC=0,raf=0,SEL="#lr .row,#dr .row";
 function ok(r){var c=r.parentNode;if(c.id=="lr")return flt=="all"&&!$("q").value.trim();if(c.id=="dr")return view=="det"&&!!det&&det.t=="u";return false}
 function clr(){clearTimeout(tm);tm=0;if(tr){tr.classList.remove("hold");tr=null}}
 function layout(){
  var dy=(ly-D.y0)+(scrollY-D.s0),c=D.tops[D.i]+D.hs[D.i]/2+dy,ni=D.i,k;
  for(k=0;k<D.n;k++){if(c>=D.tops[k]&&c<D.tops[k]+D.hs[k]){ni=k;break}}
  if(c<D.tops[0])ni=0;if(c>D.tops[D.n-1]+D.hs[D.n-1])ni=D.n-1;
  D.ni=ni;D.row.style.transform="translateY("+dy+"px) scale(1.04)";
  D.rs.forEach(function(r,k){if(k==D.i)return;var m=0;if(D.i<ni&&k>D.i&&k<=ni)m=-D.step;else if(D.i>ni&&k>=ni&&k<D.i)m=D.step;r.style.transform=m?"translateY("+m+"px)":""})
 }
 function loop(){if(!D)return;if(ly<90)scrollBy(0,-13);else if(ly>innerHeight-110)scrollBy(0,13);layout();raf=requestAnimationFrame(loop)}
 function start(r){
  clr();var c=r.parentNode,rs=[].slice.call(c.children).filter(function(x){return x.classList.contains("row")});
  var i=rs.indexOf(r);if(i<0)return;
  D={row:r,c:c,rs:rs,i:i,ni:i,n:rs.length,tops:rs.map(function(x){return x.offsetTop}),hs:rs.map(function(x){return x.offsetHeight}),s0:scrollY,y0:ly};
  D.step=D.n>1?(i<D.n-1?D.tops[i+1]-D.tops[i]:D.tops[i]-D.tops[i-1]):0;
  c.classList.add("dragmode");r.classList.add("lift");r.style.transition="box-shadow .25s,background .25s";
  if(navigator.vibrate)try{navigator.vibrate(20)}catch(e){}
  toast("اسحب لأعلى أو لأسفل لتغيير المكان");loop();
 }
 function end(cancel){
  clr();if(!D)return;cancelAnimationFrame(raf);var d=D;D=null;noC=Date.now()+450;
  var i=d.i,ni=cancel?d.i:d.ni,fin=0;
  if(ni>i)fin=d.tops[ni]+d.hs[ni]-d.hs[i]-d.tops[i];else if(ni<i)fin=d.tops[ni]-d.tops[i];
  d.row.style.transition="transform .25s var(--sp),box-shadow .25s";d.row.style.transform="translateY("+fin+"px) scale(1)";d.row.classList.remove("lift");
  setTimeout(function(){
   if(ni!=i){
    var l=shown.slice(),m=l.splice(i,1)[0];l.splice(ni,0,m);
    if(d.c.id=="lr")M.ord=l.map(function(t){return t.k});
    else{var a=M.art[det.i];a.ids=l.map(function(t){return t.k}).concat(a.ids.filter(function(k){return!K[k]}))}
    save();
   }
   d.rs.forEach(function(r){r.style.transform="";r.style.transition=""});d.c.classList.remove("dragmode");refresh(false);
  },270);
 }
 function down(x,y,t){
  var r=t.closest&&t.closest(SEL);if(!r||t.closest(".ib")||D||!ok(r))return;
  clr();sx=x;sy=y;ly=y;tr=r;r.classList.add("hold");tm=setTimeout(function(){tm=0;start(r)},380);
 }
 function mv(x,y){ly=y;if(!D&&tm&&(Math.abs(x-sx)>9||Math.abs(y-sy)>9))clr()}
 /* لمس */
 document.addEventListener("touchstart",function(e){if(e.touches.length==1)down(e.touches[0].clientX,e.touches[0].clientY,e.target);else clr()},{passive:true});
 document.addEventListener("touchmove",function(e){var t=e.touches[0];if(t)mv(t.clientX,t.clientY);if(D&&e.cancelable)e.preventDefault()},{passive:false});
 document.addEventListener("touchend",function(){end(0)},{passive:true});
 document.addEventListener("touchcancel",function(){end(1)},{passive:true});
 /* فأرة */
 document.addEventListener("pointerdown",function(e){if(e.pointerType=="mouse"&&e.button==0)down(e.clientX,e.clientY,e.target)},true);
 document.addEventListener("pointermove",function(e){if(e.pointerType=="mouse")mv(e.clientX,e.clientY)},true);
 document.addEventListener("pointerup",function(e){if(e.pointerType=="mouse")end(0)},true);

 document.addEventListener("click",function(e){if(Date.now()<noC){e.stopPropagation();e.preventDefault()}},true);
